// ==================== 运行时 ====================
let state = {
  currentSceneId: GAME.start,
  inventory: ["起始记忆"],
  loopCount: 0,
  history: [],
  visits: { [GAME.start]: 1 }
};

const PERSISTENT_ITEMS = ["起始记忆"];

updateUI();

function updateUI() {
  document.getElementById("loopCount").textContent = state.loopCount;
  const scene = GAME.scenes[state.currentSceneId];
  document.getElementById("chapterLabel").textContent = GAME.chapters[scene.chapter] || "";
  renderScene();
  renderInventory();
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// 按当前状态选择场景的显示版本（文案/提示/选项可随道具与是否重访而变）
function resolveScene(scene) {
  if (!Array.isArray(scene.variants)) return scene;
  const revisits = (state.visits[state.currentSceneId] || 0) > 1;
  for (const v of scene.variants) {
    if (v.requireItem && !state.inventory.includes(v.requireItem)) continue;
    if (v.forbidItem && state.inventory.includes(v.forbidItem)) continue;
    if (v.requireRevisit && !revisits) continue;
    if (v.requireFirstVisit && revisits) continue;
    return {
      ...scene,
      title: v.title || scene.title,
      text: v.text || scene.text,
      hints: v.hints,
      choices: v.choices || scene.choices
    };
  }
  return scene;
}

function renderScene() {
  const scene = resolveScene(GAME.scenes[state.currentSceneId]);
  const container = document.getElementById("sceneContainer");
  const t = (s) => esc(s).replace(/\n/g, "<br>");

  let html = `<div class="scene-title">【${t(scene.title)}】</div>`;
  html += `<div class="scene-text">${t(scene.text)}</div>`;

  if (scene.hints) {
    scene.hints.forEach(h => { html += `<div class="hint">💡 ${t(h)}</div>`; });
  }

  if (scene.ending) {
    let cls = "", label = "";
    if (scene.ending === "good") { cls = "ending-good"; label = "✨ TRUE ENDING · 逃脱成功"; }
    else if (scene.ending === "secret") { cls = "ending-secret"; label = "🔮 HIDDEN ENDING · 终极真相"; }
    else if (scene.ending === "loop") { cls = "ending-bad"; label = "🌀 轮回 · 记忆保留"; }
    else { cls = "ending-bad"; label = "💀 你死了"; }
    html += `<div class="${cls}">${label}</div>`;
    if (scene.endText) html += `<div class="scene-text" style="margin-top:16px;text-align:center;">${t(scene.endText)}</div>`;
    html += `<button class="restart-btn" onclick="restart()">🔄 新一轮轮回</button>`;
  } else {
    html += `<ul class="choices">`;
    scene.choices.forEach((c, i) => {
      let disabled = "";
      let reqText = c.req ? `<span class="req">[需要: ${t(c.req)}]</span>` : "";
      if (c.req && !state.inventory.includes(c.req)) disabled = "disabled";
      html += `<li><button class="choice-btn" ${disabled} onclick="makeChoice(${i})">${t(c.text)}${reqText}</button></li>`;
    });
    html += `</ul>`;
  }

  container.innerHTML = html;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderInventory() {
  const area = document.getElementById("inventoryArea");
  const HIDDEN = ["起始记忆", "红女已消散", "红女之信"];
  let items = state.inventory.filter(i => !HIDDEN.includes(i));
  if (items.length === 0) { area.innerHTML = ""; return; }
  let html = `<div class="inventory"><div class="inventory-title">📦 物品栏</div>`;
  items.forEach(i => { html += `<span class="item-tag">${esc(i)}</span>`; });
  if (state.history.length > 0) html += `<div style="margin-top:8px;color:#664;font-size:12px;">已探索: ${state.history.length} 个场景</div>`;
  html += `</div>`;
  area.innerHTML = html;
}

function makeChoice(index) {
  const scene = resolveScene(GAME.scenes[state.currentSceneId]);
  const choice = scene.choices[index];
  if (choice.req && !state.inventory.includes(choice.req)) return;

  state.history.push(state.currentSceneId);
  const targetScene = GAME.scenes[choice.next];
  if (targetScene.grantItems) {
    targetScene.grantItems.forEach(item => {
      if (!state.inventory.includes(item)) state.inventory.push(item);
    });
  }

  // 轮回结局：重置物品但保留关键项
  const needLoop = (scene.ending === "bad" || scene.ending === "loop" ||
                    targetScene.ending === "bad" || targetScene.ending === "loop");
  state.currentSceneId = choice.next;
  state.visits[state.currentSceneId] = (state.visits[state.currentSceneId] || 0) + 1;
  if (needLoop) {
    state.loopCount++;
    state.inventory = state.inventory.filter(i => PERSISTENT_ITEMS.includes(i));
    state.history = [];
    state.visits = {};
  }
  updateUI();
}

function restart() {
  state.loopCount++;
  state.currentSceneId = GAME.start;
  state.history = [];
  state.visits = { [GAME.start]: 1 };
  state.inventory = state.inventory.filter(i => PERSISTENT_ITEMS.includes(i));
  updateUI();
}
</script>
